name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          name="cert-converter-${GITHUB_REF_NAME}-windows-x64.exe"
          mkdir dist
          cp target/release/cert-converter.exe "dist/$name"
          cd dist && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
